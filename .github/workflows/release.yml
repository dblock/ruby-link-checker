name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate and build without publishing or pushing.
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: dblock/ruby-gem-release/.github/workflows/release.yml@v0.2.0
    with:
      ruby-version: '3.3'
      dry-run: ${{ inputs.dry-run }}
